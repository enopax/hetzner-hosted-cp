clusterName: ""
region: "fsn1"
sshKeyName: ""
hetznerSecretName: "hetzner"

clusterNetwork:
  pods:
    cidrBlock: "10.244.0.0/16"
  services:
    cidrBlock: "10.96.0.0/12"

etcd:
  autoDeletePVCs: true

k0s:
  version: "v1.34.4+k0s.0"

core:
  serverType: "cpx22"
  imageName: "ubuntu-24.04"
  replicas: 1

worker:
  serverType: "cpx22"
  imageName: "ubuntu-24.04"
  replicas: 2

autoscaling:
  enabled: false
  minSize: 1
  maxSize: 5
  capacityHints: {}
    # cpu: "4"
    # memory: "8Gi"

ingress:
  enabled: false
  apiHost: ""
  konnectivityHost: ""
  className: "haproxy"
  port: 443
  annotations:
    haproxy.org/ssl-passthrough: "true"
