# Werte, mit denen dieses Chart wirklich rendert.
#
# Nachgebaut aus dem laufenden `dev-dose` (ClusterDeployment `spec.config`,
# Vorlage hetzner-hosted-cp-1-5-1) - nicht aus den Chart-Vorgaben erfunden.
#
# Hier stand eine Fassung im Vokabular des **standalone**-Charts:
# `workersNumber`, `sshKeyNames` als Liste, `tokenRef`, `worker.type`,
# `clusterNetwork.pods.cidrBlocks` als Liste. Keiner dieser Schluessel wird von
# diesem Chart gelesen; `clusterName` und `sshKeyName` fehlten, und damit liess
# sich das Chart mit dieser Datei nicht einmal rendern. Siehe enopax/enopax#38.
clusterName: "eu1f-test01"
region: "fsn1"
sshKeyName: "anmn"
hetznerSecretName: "hetzner"

clusterNetwork:
  pods:
    cidrBlock: "10.244.0.0/16"
  services:
    cidrBlock: "10.96.0.0/12"

etcd:
  autoDeletePVCs: true
  # Die Fassung, die `dev-box1` heute faehrt. Sie steht hier und nicht als
  # Vorgabe im Test, damit die Datei weiter das Abbild eines laufenden
  # Clusters ist.
  image: "quay.io/k0sproject/etcd:v3.5.13"

k0s:
  version: "v1.35.4+k0s.0"

# Der statische Pool. Er entsteht nur mit `autoscaling.enabled` - ohne sie
# rendert von `core` nichts, auch nicht `replicas`.
core:
  serverType: "cpx32"
  imageName: "ubuntu-24.04"
  replicas: 1

# Der skalierbare Pool. `replicas` ist die Zahl, die ein Skalieren aendert.
worker:
  serverType: "cpx32"
  imageName: "ubuntu-24.04"
  replicas: 2

autoscaling:
  enabled: false
  minSize: 1
  maxSize: 5
  capacityHints: {}

# Ohne Ingress initialisiert die Steuerungsebene nie: sie laeuft als Pods auf
# dem regionalen Cluster und wird von aussen ueber dessen Ingress bedient.
ingress:
  enabled: true
  apiHost: "api.eu1f-test01.eu1-fsn1.k8s.enopax.io"
  konnectivityHost: "k.eu1f-test01.eu1-fsn1.k8s.enopax.io"
  className: "haproxy"
  port: 443
  annotations:
    haproxy.org/ssl-passthrough: "true"
